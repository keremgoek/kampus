<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Kampüste Bir Gün</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kampüs">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Layout: piksel tuval ortada; yakın plan sahneleri ve HTML katmanları tuvalin üstünde; telefonda altta düğmeler */
  :root {
    --bg: #181a24;
    --panel: #f5efe4;
    --panel-ink: #23222c;
    --accent: #f0b44c;
    --accent-deep: #a8701d;
    --line: #3b3f52;
    --phone-bg: #ffffff;
    --phone-ink: #1f1f24;
    --phone-mute: #8a8a94;
    --like: #e8435a;
    --f-display: "Pixelify Sans", "Courier New", monospace;
    --f-body: "Nunito", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--panel); font-family: var(--f-body);
    padding-inline: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
    padding-block: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom)); box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .stage {
    position: relative; width: min(100%, 1120px, calc((100dvh - 40px) * 16 / 9));
    aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 3px var(--line);
    background: var(--bg);
  }
  .world { position: absolute; inset: 0; transition: transform .55s cubic-bezier(.5,0,.3,1); }
  .world.zoom { transform: scale(3.2); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .hud { position: absolute; top: 2%; left: 1.5%; right: 1.5%; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  .chip {
    font-family: var(--f-display); font-size: clamp(11px, 1.7vw, 18px); line-height: 1.2;
    background: var(--panel); color: var(--panel-ink); padding: .3em .6em; border-radius: 4px; box-shadow: 0 3px 0 var(--accent-deep);
  }
  .chip b { color: var(--accent-deep); }
  .quest { display: flex; gap: .5em; align-items: center; max-width: 72%; }
  .arrow { font-size: 1.2em; color: var(--accent-deep); }
  .label {
    position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
    font-family: var(--f-display); font-size: clamp(9px, 1.4vw, 15px); color: var(--panel);
    background: color-mix(in srgb, var(--panel-ink) 75%, transparent); padding: .1em .45em; border-radius: 3px;
  }
  .prompt {
    position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
    font-family: var(--f-display); font-size: clamp(10px, 1.6vw, 16px);
    background: var(--accent); color: var(--panel-ink); padding: .15em .5em; border-radius: 3px; box-shadow: 0 2px 0 var(--accent-deep);
  }
  .prompt kbd { font: inherit; font-weight: 700; }
  .dialog {
    position: absolute; left: 3%; right: 3%; bottom: 4%; z-index: 5;
    background: var(--panel); color: var(--panel-ink); border-radius: 6px; padding: .7em 1em;
    box-shadow: 0 0 0 3px var(--accent-deep), 0 6px 0 3px var(--line);
    display: flex; flex-direction: column; gap: .4em; cursor: pointer;
  }
  .dialog .who { font-family: var(--f-display); font-weight: 700; color: var(--accent-deep); font-size: clamp(12px, 1.8vw, 19px); }
  .dialog .text { font-size: clamp(13px, 2vw, 19px); line-height: 1.4; margin: 0; max-width: 70ch; }
  .dialog .more { align-self: flex-end; font-family: var(--f-display); font-size: clamp(10px, 1.4vw, 14px); opacity: .7; }
  .choices { display: flex; flex-wrap: wrap; gap: .5em; }
  .btn {
    font-family: var(--f-display); font-size: clamp(12px, 1.8vw, 18px); font-weight: 600;
    background: var(--accent); color: var(--panel-ink); border: 0; border-radius: 4px; padding: .45em 1em;
    box-shadow: 0 3px 0 var(--accent-deep); cursor: pointer;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-deep); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--panel-ink); }
  .btn:focus-visible, .pad button:focus-visible, .hot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .fade {
    position: absolute; inset: 0; z-index: 6; background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-family: var(--f-display); font-size: clamp(16px, 3vw, 32px); color: var(--panel); text-align: center; padding: 1em;
    opacity: 0; pointer-events: none; transition: opacity .45s;
  }
  .fade.on { opacity: 1; }
  .banner {
    position: absolute; top: 14%; left: 50%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .3s, transform .3s; z-index: 4;
    font-family: var(--f-display); font-size: clamp(12px, 2vw, 20px); background: var(--panel-ink); color: var(--accent);
    padding: .35em .9em; border-radius: 4px; pointer-events: none; white-space: nowrap;
  }
  .banner.on { opacity: 1; transform: translate(-50%, 0); }

  /* Yakın plan */
  .close { position: absolute; inset: 0; z-index: 3; animation: closeIn .35s ease; }
  @keyframes closeIn { from { opacity: 0; } to { opacity: 1; } }
  .cui { position: absolute; inset: 0; }
  .hot { position: absolute; background: transparent; border: 2px dashed transparent; border-radius: 6px; cursor: pointer; padding: 0; }
  .hot:hover { border-color: var(--accent); }
  .hot[aria-pressed="true"] { border: 3px solid var(--accent); }
  .hot span {
    position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 110%); white-space: nowrap;
    font-family: var(--f-display); font-size: clamp(10px, 1.5vw, 15px); background: var(--panel-ink); color: var(--panel); padding: .1em .45em; border-radius: 3px;
  }
  .hot[aria-pressed="true"] span { background: var(--accent); color: var(--panel-ink); }
  .cbar {
    position: absolute; left: 3%; right: 3%; bottom: 3%; display: flex; gap: .6em; align-items: center; justify-content: space-between; flex-wrap: wrap;
    background: var(--panel); color: var(--panel-ink); padding: .5em .8em; border-radius: 6px; box-shadow: 0 0 0 3px var(--accent-deep);
  }
  .cbar p { margin: 0; font-size: clamp(12px, 1.8vw, 17px); min-width: 0; flex: 1 1 14em; }
  .cbar div { display: flex; gap: .5em; }
  .drag { position: absolute; inset: 0; touch-action: none; }
  .phone {
    position: absolute; top: 3%; height: 94%; left: 50%; transform: translateX(-50%); aspect-ratio: 9 / 18;
    background: var(--panel-ink); border-radius: 18px; padding: 1.4%; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .screen {
    height: 100%; overflow-y: auto; background: var(--phone-bg); color: var(--phone-ink); border-radius: 13px;
    font-family: var(--f-body); font-size: clamp(9px, 1.35vw, 14px); scrollbar-width: none; overscroll-behavior: contain; touch-action: pan-y;
  }
  .screen::-webkit-scrollbar { display: none; }
  .apphead { position: sticky; top: 0; background: var(--phone-bg); padding: .7em .8em .5em; font-family: var(--f-display); font-weight: 700; font-size: 1.25em; border-bottom: 1px solid #ececf0; z-index: 1; }
  .post { border-bottom: 1px solid #ececf0; padding-bottom: .5em; }
  .post header { display: flex; align-items: center; gap: .45em; padding: .5em .7em; font-weight: 800; }
  .av { width: 1.8em; height: 1.8em; border-radius: 50%; flex: none; }
  .post canvas { width: 100%; height: auto; aspect-ratio: 4 / 3; display: block; cursor: pointer; }
  .acts { display: flex; align-items: center; gap: .4em; padding: .4em .7em 0; font-weight: 800; }
  .heart { background: none; border: 0; padding: 0; font-size: 1.5em; line-height: 1; color: var(--phone-ink); cursor: pointer; }
  .heart.on { color: var(--like); animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.4); } }
  .post p { margin: .2em .7em 0; line-height: 1.35; }
  .post p b { font-weight: 800; }
  .feedend { padding: 1.2em .8em 2em; text-align: center; color: var(--phone-mute); }
  /* WhatsApp bildirimi ve grup sohbeti */
  .notif {
    position: absolute; top: 4%; left: 6%; right: 6%; z-index: 2; text-align: left; cursor: pointer;
    background: rgba(246,246,248,.97); color: var(--phone-ink); border: 0; border-radius: 12px; padding: .55em .7em;
    font-family: var(--f-body); font-size: clamp(9px, 1.35vw, 14px); box-shadow: 0 6px 18px rgba(0,0,0,.3);
    animation: notifIn .45s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes notifIn { from { transform: translateY(-140%); } to { transform: none; } }
  .notif small { display: block; color: var(--phone-mute); font-size: .8em; }
  .notif b { display: block; }
  .chat {
    position: absolute; inset: 1.4%; z-index: 3; border-radius: 13px; overflow: hidden; display: flex; flex-direction: column;
    background: #ece5dc; color: var(--phone-ink); font-family: var(--f-body); font-size: clamp(9px, 1.35vw, 14px);
  }
  .chat header { display: flex; align-items: center; gap: .5em; padding: .6em .6em; background: #23614f; color: #fff; }
  .chat header button { background: none; border: 0; color: #fff; font-size: 1.6em; line-height: 1; padding: 0 .2em; cursor: pointer; }
  .chat header small { display: block; opacity: .8; font-size: .8em; }
  .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: .5em 0; scrollbar-width: none; }
  .msg { max-width: 78%; align-self: flex-start; background: #fff; padding: .35em .6em; border-radius: 9px; margin: .2em .6em; line-height: 1.3; animation: closeIn .3s; }
  .msg b { display: block; font-size: .8em; }
  .msg.me { align-self: flex-end; background: #d6f3c4; }
  .replies { display: flex; flex-direction: column; gap: .35em; padding: .5em; background: #f6f3ee; }
  .replies button { font: inherit; text-align: left; background: #fff; border: 1px solid #d8d2c8; border-radius: 16px; padding: .4em .7em; cursor: pointer; }
  /* Telefon görüşmesi */
  .screen.call {
    background: linear-gradient(#34405a, #151c29); color: #fff; display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; padding: 22% 0 16%; box-sizing: border-box; text-align: center;
  }
  .cav { width: 4.6em; height: 4.6em; border-radius: 50%; background: #e7b7c8; color: #6a2c40; display: grid; place-items: center; font-size: 1.5em; font-weight: 800; margin: 0 auto .5em; }
  .cname { font-weight: 800; font-size: 1.5em; display: block; }
  .cst { opacity: .75; }
  .accept { width: 3.8em; height: 3.8em; border-radius: 50%; border: 0; background: #34c759; color: #fff; font-size: 1.3em; cursor: pointer; animation: ring 1s infinite; }
  .accept.end { background: #e5484d; animation: none; }
  @keyframes ring { 50% { transform: scale(1.12); } }
  .side { position: absolute; right: 3%; bottom: 4%; display: flex; flex-direction: column; gap: .5em; align-items: flex-end; max-width: 28%; }
  .side p { margin: 0; font-family: var(--f-display); font-size: clamp(10px, 1.5vw, 15px); text-align: right; background: var(--panel-ink); color: var(--panel); padding: .3em .6em; border-radius: 4px; }

  .card {
    position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5%;
    padding: 5%; text-align: center; background: color-mix(in srgb, var(--bg) 88%, transparent);
  }
  .card h1 { font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: clamp(26px, 6vw, 64px); line-height: 1; margin: 0; text-wrap: balance; }
  .card p { margin: 0; max-width: 46ch; font-size: clamp(13px, 2vw, 19px); line-height: 1.5; text-wrap: pretty; }
  .card .letter { font-family: var(--f-display); font-size: clamp(16px, 3vw, 30px); line-height: 1.35; white-space: pre-line; max-width: 32ch; }
  .card .keys { font-size: clamp(11px, 1.5vw, 14px); opacity: .75; }
  .pad { display: none; width: 100%; max-width: 1120px; justify-content: space-between; gap: 12px; }
  .pad div { display: flex; gap: 10px; }
  .pad button {
    min-width: 64px; height: 56px; padding: 0 14px; border-radius: 8px; border: 0;
    background: var(--line); color: var(--panel); font-family: var(--f-display); font-size: 18px; touch-action: none;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--line) 60%, black);
  }
  .pad button.on { background: var(--accent); color: var(--panel-ink); }
  @media (hover: none) and (pointer: coarse) {
    .pad { display: flex; }
    .stage { width: min(100%, 1120px, calc((100dvh - 110px) * 16 / 9)); }
    .card .keys { display: none; }
  }
  /* Telefon dik tutulursa oyun çok küçük kalıyor: yan çevirmesini iste */
  .rotate { display: none; }
  @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
    .rotate {
      display: flex; position: fixed; inset: 0; z-index: 50; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: var(--bg); color: var(--panel); font-family: var(--f-display); font-size: 22px; text-align: center; padding: 24px;
    }
    .rotate span { font-size: 56px; animation: tilt 1.6s ease-in-out infinite; }
  }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { .fade, .banner, .world { transition: none; } .close, .heart.on, .notif, .msg, .accept, .rotate span { animation: none; } }
</style>

</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <canvas id="cv" width="640" height="360" aria-label="Oyun alanı"></canvas>
    <div id="labels"></div>
    <div class="prompt" id="prompt" hidden></div>
  </div>
  <div class="close" id="close" hidden>
    <canvas id="ccv" width="640" height="360" aria-hidden="true"></canvas>
    <div class="cui" id="cui"></div>
  </div>
  <div class="hud">
    <div class="chip quest"><span id="clock">07:30</span><span id="qtext"></span></div>
    <div class="chip arrow" id="arrow" hidden>→</div>
  </div>
  <div class="banner" id="banner"></div>
  <div class="dialog" id="dialog" hidden>
    <div class="who" id="dwho"></div>
    <p class="text" id="dtext"></p>
    <div class="choices" id="dchoices"></div>
    <div class="more" id="dmore">E / dokun ▸</div>
  </div>
  <div class="fade" id="fade"></div>
  <div class="card" id="intro">
    <h1>Kampüste Bir Gün</h1>
    <p id="introText"></p>
    <button class="btn" id="start" type="button">Güne başla</button>
    <p class="keys">A / D veya yön tuşları: yürü · Boşluk: zıpla · E: kullan / konuş · Esc: yakın planı kapat</p>
  </div>
  <div class="card" id="outro" hidden>
    <h1 id="outroTitle"></h1>
    <p class="letter" id="letter"></p>
    <button class="btn" id="again" type="button">Baştan oyna</button>
  </div>
</div>
<div class="pad">
  <div><button id="bL" type="button" aria-label="Sola">◀</button><button id="bR" type="button" aria-label="Sağa">▶</button></div>
  <div><button id="bE" type="button">Kullan</button><button id="bJ" type="button">Zıpla</button></div>
</div>
<div class="rotate" aria-live="polite"><span aria-hidden="true">📱</span>Telefonu yan çevir</div>

<script>
/* ============ Kişiselleştirme ============ */
const CONFIG = {
  herName: "Buket",
  fromName: "Kerem",
  outroTitle: "İyi ki varsın",
  letter: "İki gün boyunca koşturdun: stüdyo, ders, kütüphane, tenis, alışveriş...\nGünün sonunda seni görmek benim en sevdiğim an.\nSeni çok seviyorum aşkım.",
};
const HER = CONFIG.herName;

/* ============ Dünya ============ */
const VW = 320, VH = 180, WORLD = 1260, G = 170, F2 = 102;
const SHOE = "#2a2420";
const cv = $("cv"), ctx = cv.getContext("2d");
const ccv = $("ccv"), cctx = ccv.getContext("2d");
function $(id) { return document.getElementById(id); }
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const solids = [
  {x: -20, y: G, w: WORLD + 40, h: 20},
  {x: 0, y: 136, w: 172, h: 2},
  {x: 0, y: F2, w: 192, h: 2},
  {x: 0, y: 68, w: 172, h: 2},
  {x: 0, y: 34, w: 174, h: 3},
  {x: 0, y: 70, w: 2, h: 32},
  {x: 190, y: 92, w: 2, h: 10},
  {x: -4, y: 0, w: 4, h: VH}, {x: WORLD, y: 0, w: 4, h: VH},
];
const tiers = [[450,464,4],[464,478,8],[478,492,12],[492,506,16],[506,520,20],[520,534,24],[534,540,20],[540,546,16],[546,552,12],[552,558,8],[558,564,4]];
tiers.forEach(([a, b, h]) => solids.push({x: a, y: G - h, w: b - a, h}));

const PEOPLE = {
  her:   {hair: "#8a5a3b", long: true,  shirt: "#d98f6a", pants: "#4a6283", skin: "#f8e0d0"},
  Asya:  {hair: "#1b1b1b", long: true,  shirt: "#8a5cc2", pants: "#3a3550"},
  Nilsu: {hair: "#b9793a", long: true,  shirt: "#e7b7c8", pants: "#4a4a5a"},
  Mert:  {hair: "#4a3020", long: false, shirt: "#3c6fb0", pants: "#2d2d38"},
  Emir:  {hair: "#1b1b1b", long: false, shirt: "#d0703a", pants: "#3a3a3a"},
  Kerem: {hair: "#2a1f18", long: false, shirt: "#c43c4c", pants: "#26303f"},
  Halil: {hair: "#bdbdbd", long: false, shirt: "#efeee8", pants: "#4a4a52", vest: "#6b4a32", mustache: "#8d8d8d", skin: "#e2b38e"},
};
const friends = [
  {name: "Asya", x: 1016, face: 1,  line: ["Kızım nerdesin yaa, çayın soğudu bak! Al şunu.", "Bu sabah gruba niye yazmadın, yine Instagram'da kaybolmuşsun belli."]},
  {name: "Nilsu", x: 1030, face: 1,  line: ["Maketi bitirdin mi? Ben daha yarısındayım, ağlayacağım.", "Yarın stüdyoda beraber oturalım mı? Yalnız yapamıyorum."]},
  {name: "Mert", x: 1068, face: -1, line: ["Buket, yarın sabah tenis var, unutmadın di mi?", "Kortu dokuza ayırttım. Bu sefer de yenersem artık bırakırsın bence."]},
  {name: "Emir", x: 1082, face: -1, line: ["Mert'e inanma, geçen hafta bana 6-1 yenildi.", "Ama servisi gerçekten gelişmiş, yarın backhand'ine dikkat et derim."]},
];

const QUESTS = {1: [
  {t: "Uyan", time: "07:30", x: 154, home: true},
  {t: "Yatakta biraz Instagram'a bak", time: "07:32", x: 154, home: true},
  {t: "Gözlüğünü seç", time: "08:05", x: 91, home: true},
  {t: "Buzdolabından kahvaltılık seç", time: "08:10", x: 42, home: true},
  {t: "Evden çık", time: "08:25", x: 22, home: true},
  {t: "Kapıcı Halil Bey'e günaydın de", time: "08:28", x: 70},
  {t: "Stüdyoda maketini bitir", time: "08:35", x: 300},
  {t: "Amfide derse gir", time: "09:30", x: 485},
  {t: "Kütüphanede ders çalış", time: "13:30", x: 905},
  {t: "Kafeteryada arkadaşlarınla buluş", time: "16:30", x: 1050},
  {t: "Dışarı çık, Kerem seni almaya geliyor", time: "19:00", x: 1218},
], 2: [
  {t: "Uyan, bugün tenis var", time: "08:30", x: 154, home: true},
  {t: "Evden çık, Mert aşağıda bekliyor", time: "08:40", x: 22, home: true},
  {t: "Mert'le tenise git", time: "08:45", x: 196},
  {t: "Kaiserstraße'de kıyafet alışverişi yap", time: "12:30", x: 196},
  {t: "Eve dön, yatakta biraz kestir", time: "15:00", x: 154, home: true},
  {t: "Annen arıyor, telefonu aç", time: "17:00", x: 154, home: true},
]};
let day = 1, quests = QUESTS[1];

const labels = [
  {x: 86, y: 30, text: "Ev"}, {x: 300, y: 96, text: "Mimarlık · Bina 20.40"}, {x: 487, y: 104, text: "Amfi"},
  {x: 668, y: 92, text: "KIT Campus Süd"}, {x: 880, y: 90, text: "KIT-Bibliothek · 24/7"}, {x: 1060, y: 110, text: "Kafeterya"},
];
labels.forEach(l => { l.el = document.createElement("div"); l.el.className = "label"; l.el.textContent = l.text; $("labels").appendChild(l.el); });

/* ============ Durum ============ */
let p, cam, quest, talked, glasses, inBed, locked, frame, ended, halilCalled, maketDone, scene = null;
const car = {x: WORLD + 60, parked: false};
const keys = {l: false, r: false, j: false};

function startDay(n, data = {}) { day = n; quests = QUESTS[n]; reset(data); }
function reset(data = {}) {
  quest = data.quest ?? 0; talked = new Set(data.talked ?? []); glasses = data.glasses ?? null;
  inBed = day === 1 ? quest <= 1 : (quest === 0 || quest === 5); halilCalled = data.halilCalled ?? false; maketDone = day === 2 || quest > 6;
  car.parked = day === 1 && quest >= 10; car.x = car.parked ? 1180 : WORLD + 60;
  p = {x: data.x ?? 152, y: data.y ?? F2 - 15, w: 6, h: 15, vx: 0, vy: 0, on: false, face: -1, walk: 0};
  locked = false; frame = 0; ended = false;
  cam = Math.max(0, Math.min(WORLD - VW, p.x - VW * 0.45));
  updateHud();
}

/* ============ Diyalog ve bildirimler ============ */
let dq = [], dDone = null;
function say(lines, done) { dq = lines.slice(); dDone = done || null; locked = true; nextLine(); }
function nextLine() {
  const l = dq.shift();
  if (!l) { $("dialog").hidden = true; if (!scene) locked = false; const d = dDone; dDone = null; d && d(); return; }
  $("dialog").hidden = false;
  $("dwho").textContent = l.who || ""; $("dwho").hidden = !l.who;
  $("dtext").textContent = l.text;
  const box = $("dchoices"); box.innerHTML = "";
  $("dmore").hidden = !!l.choices;
  (l.choices || []).forEach(([label, fn]) => {
    const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = label;
    b.addEventListener("click", e => { e.stopPropagation(); dq = []; dDone = null; $("dialog").hidden = true; if (!scene) locked = false; fn(); });
    box.appendChild(b);
  });
  $("dialog").dataset.choice = l.choices ? "1" : "";
  if (l.choices) box.firstChild.focus();
}
$("dialog").addEventListener("click", () => { if (!$("dialog").dataset.choice) nextLine(); });

function fade(text, mid, done) {
  locked = true; const f = $("fade"); f.textContent = text; f.classList.add("on");
  setTimeout(() => { mid && mid(); }, 600);
  setTimeout(() => { f.classList.remove("on"); setTimeout(() => { if (!scene) locked = false; done && done(); }, 450); }, 1900);
}
let bannerT;
function banner(text) {
  const b = $("banner"); b.textContent = text; b.classList.add("on");
  clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove("on"), 2600);
}
function updateHud() {
  const q = quests[quest];
  $("clock").innerHTML = "<b>" + day + ". gün · " + (q ? q.time : "19:30") + "</b>";
  let t = q ? q.t : "";
  if (day === 1 && quest === 9) t += " (" + talked.size + "/4)";
  $("qtext").textContent = t;
}
function advance() { quest++; updateHud(); if (quests[quest]) banner("Yeni görev: " + quests[quest].t); }
function orderMsg() { return [{text: "Sırayla gidelim. Şu an yapman gereken: " + quests[quest].t + "."}]; }

/* ============ Yakın plan sahneleri ============ */
function zoomTo(wx, wy, sc) {
  locked = true; $("prompt").hidden = true;
  const w = $("world");
  w.style.transformOrigin = ((wx - cam) / VW * 100) + "% " + (wy / VH * 100) + "%";
  w.classList.add("zoom");
  setTimeout(() => { scene = sc; $("cui").innerHTML = ""; sc.open($("cui")); $("close").hidden = false; }, reduceMotion ? 0 : 520);
}
function closeScene(after) {
  $("close").hidden = true; $("cui").innerHTML = ""; scene = null;
  $("world").classList.remove("zoom");
  setTimeout(() => { locked = false; after && after(); }, reduceMotion ? 0 : 520);
}
function C(x, y, w, h, c) { cctx.fillStyle = c; cctx.fillRect(Math.round(x), Math.round(y), w, h); }
function disc(c2, cx, cy, r, col) { c2.fillStyle = col; for (let dy = -r; dy <= r; dy++) { const dx = Math.round(Math.sqrt(r * r - dy * dy)); c2.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1); } }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  if (kind === "cat") { R2(0,0,64,48,"#e9dfd0"); R2(10,34,44,10,"#b85c5c"); disc(c,32,30,12,"#e09a4a"); R2(22,16,5,6,"#e09a4a"); R2(37,16,5,6,"#e09a4a"); disc(c,32,24,8,"#e09a4a"); R2(28,23,2,1,"#2a1d1d"); R2(35,23,2,1,"#2a1d1d"); R2(31,26,2,1,"#c27066"); }

  if (kind === "maket") { R2(0,0,64,48,"#cfd3d6"); R2(6,36,52,6,"#f7f6f2"); R2(12,18,12,18,"#ffffff"); R2(24,26,22,10,"#ffffff"); R2(24,20,26,5,"#ececE6"); R2(46,32,3,4,"#1f1f24"); disc(c,52,32,3,"#6aa06a"); }
  if (kind === "sunset") { for (let y = 0; y < 48; y++) { c.fillStyle = y < 24 ? "#e58a5a" : "#b05e78"; if (y < 12) c.fillStyle = "#f6c98a"; c.fillRect(0, y, 64, 1); } disc(c,40,26,7,"#fff1b8"); R2(0,30,14,18,"#3a2c45"); R2(16,26,10,22,"#3a2c45"); R2(50,32,14,16,"#3a2c45"); R2(28,34,22,14,"#3a2c45"); }
  if (kind === "us") { R2(0,0,64,48,"#f5d9d9"); R2(0,38,64,10,"#c9a27a");
    const fig = (x, hair, shirt, long) => { R2(x,10,10,3,hair); R2(x+1,13,8,8,"#f2d3be"); if (long) R2(x,13,2,12,hair); R2(x,21,10,10,shirt); R2(x+1,31,3,7,"#3a4a63"); R2(x+6,31,3,7,"#3a4a63"); };
    fig(18, "#8a5a3b", "#d98f6a", true); fig(36, "#2a1f18", "#c43c4c", false);
    R2(29,4,2,2,"#e8435a"); R2(33,4,2,2,"#e8435a"); R2(29,6,6,2,"#e8435a"); R2(31,8,2,2,"#e8435a"); }
}

const SLOT = {x: 128, y: 62, w: 56, h: 14};
const maketScene = {
  open(ui) {
    this.piece = {x: 236, y: 134}; this.drag = null; this.anim = 0; this.done = false;
    const layer = el("div", "drag"); ui.appendChild(layer);
    const toCanvas = e => { const r = layer.getBoundingClientRect(); return {x: (e.clientX - r.left) / r.width * 320, y: (e.clientY - r.top) / r.height * 180}; };
    layer.addEventListener("pointerdown", e => {
      if (this.done || this.anim) return;
      const q = toCanvas(e), pc = this.piece;
      if (q.x > pc.x - 8 && q.x < pc.x + SLOT.w + 8 && q.y > pc.y - 8 && q.y < pc.y + SLOT.h + 8) { this.drag = {dx: q.x - pc.x, dy: q.y - pc.y}; layer.setPointerCapture(e.pointerId); }
    });
    layer.addEventListener("pointermove", e => { if (!this.drag) return; const q = toCanvas(e); this.piece.x = q.x - this.drag.dx; this.piece.y = q.y - this.drag.dy; });
    const up = () => { if (!this.drag) return; this.drag = null; if (Math.hypot(this.piece.x - SLOT.x, this.piece.y - SLOT.y) < 16) this.finish(); };
    layer.addEventListener("pointerup", up); layer.addEventListener("pointercancel", up);
    const bar = el("div", "cbar"); this.msg = el("p", null, "Son parçayı sürükleyip kesik çizgili boşluğa bırak."); const box = el("div");
    this.auto = el("button", "btn", "Parçayı yerleştir"); this.auto.type = "button";
    const cl = el("button", "btn ghost", "Kapat"); cl.type = "button";

    box.append(this.auto, cl); bar.append(this.msg, box); ui.appendChild(bar);
  },
  place() { if (!this.done && !this.anim) this.anim = 1; },
  key(k) { if (k === "e" || k === "E" || k === "Enter") this.place(); },
  finish() {
    this.done = true; this.anim = 0; this.piece = {x: SLOT.x, y: SLOT.y}; this.t = frame; maketDone = true;
    this.msg.textContent = "Tam oturdu! Maket bitti."; this.auto.disabled = true;
    setTimeout(() => closeScene(() => say([{text: "Son parçayı yapıştırdın. Jüri bunu görünce çok beğenecek."}], advance)), 1500);
  },
  cancel() { closeScene(); },
  draw() {
    if (this.anim) { this.piece.x += (SLOT.x - this.piece.x) * 0.15; this.piece.y += (SLOT.y - this.piece.y) * 0.15; if (Math.hypot(this.piece.x - SLOT.x, this.piece.y - SLOT.y) < 1) this.finish(); }
    C(0, 0, 320, 180, "#b58a62"); for (let y = 6; y < 180; y += 14) C(0, y, 320, 1, "#a77c55");
    C(200, 110, 120, 70, "#3d6b5a"); for (let x = 204; x < 320; x += 10) C(x, 110, 1, 70, "#4f7f6d"); for (let y = 114; y < 180; y += 10) C(200, y, 120, 1, "#4f7f6d");
    C(40, 112, 160, 14, "#e9e4da"); C(40, 124, 160, 3, "#cbc4b6");
    C(70, 50, 40, 62, "#fbfaf6"); C(106, 50, 4, 62, "#dcdad3"); for (let y = 58; y < 108; y += 10) C(76, y, 28, 2, "#c9d4dc");

const tennisScene = {
  open(ui) {
    Object.assign(this, {me: 0, mert: 0, pause: 70, ball: null, swing: 0, over: false, done: false, rally: 0});
    const sign = el("div", "label"); Object.assign(sign.style, {left: "50%", top: "13%"}); ui.appendChild(sign); this.score = sign;
    const bar = el("div", "cbar"); this.msg = el("p", null, "Top sana gelince Vur'a bas (E veya Boşluk). 3 sayıyı alan kazanır.");
    const box = el("div"); this.hitB = el("button", "btn", "Vur!"); this.hitB.type = "button";
    const skip = el("button", "btn ghost", "Atla"); skip.type = "button";
    this.hitB.addEventListener("click", () => this.hit()); skip.addEventListener("click", () => this.finish(true));
    box.append(this.hitB, skip); bar.append(this.msg, box); ui.appendChild(bar);
    this.upd();
  },
  upd() { this.score.textContent = HER + " " + this.me + " – " + this.mert + " Mert"; },
  hit() { if (!this.over && !this.swing) this.swing = 16; },
  key(k) { if (k === "e" || k === "E" || k === " " || k === "Enter") this.hit(); },
  bx() { const b = this.ball; return b.dir < 0 ? 250 - b.t * 215 : 66 + b.t * 184; },
  by() { return 140 - Math.sin(this.ball.t * Math.PI) * 46; },
  point(mine) {
    mine ? this.me++ : this.mert++; this.upd(); this.ball = null; this.pause = 70;
    this.msg.textContent = mine ? "Mert topu kaçırdı! Sayı senin." : "Kaçırdın! Sayı Mert'in.";
    if (this.me >= 3 || this.mert >= 3) { this.over = true; setTimeout(() => this.finish(false), 1000); }
  },
  step() {
    if (this.swing) this.swing--;
    if (this.over) return;
    if (!this.ball) { if (--this.pause <= 0) { this.ball = {dir: -1, t: 0, dur: 82}; this.rally = 0; this.msg.textContent = "Mert servis atıyor..."; } return; }
    const b = this.ball; b.t += 1 / b.dur;
    const x = this.bx();
    if (b.dir < 0 && this.swing > 7 && x > 44 && x < 88) { b.dir = 1; b.t = 0; b.dur = Math.max(50, b.dur - 5); this.rally++; this.msg.textContent = this.rally > 2 ? "Ralli uzadı!" : "Güzel vuruş!"; return; }
    if (b.t >= 1) {
      if (b.dir < 0) this.point(false);
      else if (Math.random() < 0.3 + this.rally * 0.08) this.point(true);
      else { b.dir = -1; b.t = 0; }
    }
  },
  finish(skipped) {
    if (this.done) return; this.done = true; this.over = true; this.hitB.disabled = true;
    const won = this.me >= 3;
    const lines = skipped ? [{who: "Mert", text: "Tamam, bugünlük bu kadar. Kollarım koptu."}]
      : won ? [{who: "Mert", text: "Tamam tamam, bugün senin günün. Ama rövanş var, haberin olsun."}, {who: HER, text: "Rövanşı da alırım, hiç merak etme."}]
      : [{who: HER, text: "Off yaa, yine kaybettim. Haftaya görürsün!"}, {who: "Mert", text: "Her hafta aynı şeyi diyorsun ama."}];
    lines.push({who: "Mert", text: "Ben eve geçiyorum, duş alıp uyuyacağım. Sen ne yapıyorsun?"},
      {who: HER, text: "Şehre ineceğim, biraz kıyafet bakacağım. Görüşürüz!"});
    say(lines, () => fade("Öğlen · Kaiserstraße", () => { advance(); setScene(shopScene); }));
  },

    C(126, 124, 2, 26, "#3a3a40"); C(192, 124, 2, 26, "#3a3a40");
    personAt(cctx, 28, 104, PEOPLE.her, 1, 0, glasses, 3);
    personAt(cctx, 266, 104, PEOPLE.Mert, -1, 0, null, 3);
    const up = this.swing > 7 ? -14 : 0, fw = this.swing > 7 ? 6 : 0;
    C(50 + fw, 128 + up / 2, 2, 9, "#3a3a40"); C(48 + fw, 116 + up, 8, 12, "#e8435a"); C(50 + fw, 118 + up, 4, 8, "#f4f0e3");
    C(262, 128, 2, 9, "#3a3a40"); C(258, 116, 8, 12, "#3b6fd1"); C(260, 118, 4, 8, "#f4f0e3");
    if (this.ball) { const x = Math.round(this.bx()), y = Math.round(this.by()); C(x + 1, 150, 3, 1, "rgba(0,0,0,.25)"); C(x, y, 4, 4, "#d9f04a"); C(x + 1, y + 1, 1, 1, "#ffffff"); }

  p.walk = !p.on ? 1 : dir ? 1 + (Math.floor(frame / 7) % 2) : 0;
  if (keys.j && p.on && !locked && !inBed) { p.vy = -2.6; p.on = false; }

  p.x += p.vx;

    const rise = p.y + p.h - s.y;

  }
  p.y += p.vy; p.on = false;
  for (const s of solids) if (hit(p, s)) {
    if (p.vy > 0) { p.y = s.y - p.h; p.on = true; } else p.y = s.y + s.h;
    p.vy = 0;
  }
  if (day === 1 && quest >= 10 && !car.parked) { car.x -= 2.2; if (car.x <= 1180) { car.x = 1180; car.parked = true; banner(CONFIG.fromName + " geldi!"); } }
  if (day === 1 && quest === 5 && !halilCalled && !locked && p.on && p.y + p.h >= G - 1 && p.x > 42 && p.x < 170) { halilCalled = true; halilTalk(); }
  const target = Math.max(0, Math.min(WORLD - VW, p.x - VW * 0.45));
  cam += (target - cam) * 0.1;
}

  ctx.globalAlpha = 1;
  const hillA = hexLerp("#a9bfcc", "#2c3150", nf), hillB = hexLerp("#7fa28a", "#20283a", nf);
  for (let x = 0; x < 640; x += 2) { const w = x + camPx * 0.06; const h = 120 + Math.sin(w / 97) * 22 + Math.sin(w / 41) * 8; ctx.fillStyle = hillA; ctx.fillRect(x / 2, (340 - h) / 2, 1, h / 2); }
  for (let x = 0; x < 640; x += 2) { const w = x + camPx * 0.16; const h = 78 + Math.sin(w / 63) * 12 + Math.floor(hash(Math.floor(w / 6), 2) * 6); ctx.fillStyle = hillB; ctx.fillRect(x / 2, (340 - h) / 2, 1, h / 2); }
  const off = Math.floor(camPx * 0.35) % 1280;
  for (const [img, a] of [[SKYLINE[0], 1], [SKYLINE[1], nf]]) { if (a <= 0) continue; ctx.globalAlpha = a; ctx.drawImage(img, -off / 2, 0, 640, 180); ctx.drawImage(img, (1280 - off) / 2, 0, 640, 180); }
  ctx.globalAlpha = 1;

  ctx.drawImage(BG, camPx, 0, 640, 360, 0, 0, VW, VH);
  // dinamik detaylar
  Q(102, 152, 24, 10, st); Q(102, 162, 24, 10, sb); Q(113, 152, 2, 20, "#ffffff"); Q(102, 161, 24, 2, "#ffffff");
  if (maketDone) { Q(596, 292, 16, 4, "#ffffff"); Q(596, 295, 16, 1, "#d8d8d0"); }
  if (inBed) {
    const h = PEOPLE.her;
    Q(289, 177, 12, 10, h.hair); Q(287, 182, 4, 8, h.hair); Q(292, 179, 8, 8, h.skin); Q(292, 179, 8, 2, h.hair); Q(299, 183, 1, 3, shade(h.skin, .86));
    Q(298, 184, 30, 8, "#6fa37a"); Q(298, 184, 30, 2, "#8fc39a"); for (let k = 302; k < 328; k += 6) Q(k, 186, 2, 6, "#5f936a");
    if (quest === 0) {
      Q(295, 183, 2, 1, "#2a1d1d"); Q(296, 185, 2, 1, "#c27066");
      const zt = frame % 120; if (zt < 90) { const zy = 172 - zt / 6; Q(300 + zt / 10, zy, 4, 1, "#ffffff"); Q(302 + zt / 10, zy + 1, 1, 1, "#ffffff"); Q(301 + zt / 10, zy + 2, 1, 1, "#ffffff"); Q(300 + zt / 10, zy + 3, 4, 1, "#ffffff"); }
    } else {
      Q(296, 182, 1, 2, "#2a2030"); Q(295, 182, 1, 1, "#ffffff");
      const ring = day === 2 && frame % 30 < 15;
      Q(300, 175, 6, 9, "#2a2a30"); Q(301, 176, 4, 7, ring ? "#7ee08a" : "#cfe6ff"); Q(299, 182, 3, 3, h.skin);
      if (ring) { Q(308, 174, 1, 3, "#f0b44c"); Q(297, 172, 1, 3, "#f0b44c"); Q(310, 178, 1, 2, "#f0b44c"); }
    }
  } else { Q(300, 186, 28, 6, "#6fa37a"); Q(300, 186, 28, 1, "#8fc39a"); for (let k = 304; k < 328; k += 6) Q(k, 187, 2, 5, "#5f936a"); }
  drawTram();
  if (day === 1 && quest >= 10) drawCar(car.x);
  // gece: karart, sonra ışıklar
  if (nf > 0) {
    ctx.fillStyle = "rgba(14,16,44," + (0.4 * nf) + ")"; ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = nf;
    LIT.forEach(([x, y, w, h, fr]) => {
      if (x + w < camPx || x > camPx + 640 || hash(x, y) < .2) return;
      Q(x, y, w, h, "#ffd98a"); Q(x, y + h - 3, w, 3, "#f0b860");
      if (fr) { Q(x + Math.floor(w / 2) - 1, y, 2, h, fr); Q(x, y + Math.floor(h / 2) - 1, w, 2, fr); }
    });
    Q(4, 140, 336, 64, "rgba(255,200,120,.12)");
    LAMPS.forEach(x => {
      if (x < camPx - 40 || x > camPx + 680) return;
      Q(x - 1, 292, 4, 4, "#ffe9a8");
      const gx = (x + 1 - camPx) / 2, gr = ctx.createRadialGradient(gx, 147, 0, gx, 147, 22);
      gr.addColorStop(0, "rgba(255,225,150,.35)"); gr.addColorStop(1, "rgba(255,225,150,0)"); ctx.fillStyle = gr; ctx.fillRect(gx - 22, 125, 44, 45);
    });
    ctx.globalAlpha = 1;
    if (day === 1 && quest >= 10 && !car.parked) { const X = (Math.round(car.x * 2) - camPx) / 2; ctx.fillStyle = "rgba(255,233,168,.35)"; ctx.beginPath(); ctx.moveTo(X, G - 6); ctx.lineTo(X - 30, G - 10); ctx.lineTo(X - 30, G); ctx.fill(); }
  }
  // insanlar
  if (day === 1) friends.forEach(f => person(f.x - 4, G - 16, PEOPLE[f.name], f.face, 0, f.name === "Nilsu" ? "red" : null));
  person(66, G - 16, PEOPLE.Halil, p.x < 66 ? -1 : 1, 0, null);
  if (day === 2 && quest <= 2) { person(192, G - 16, PEOPLE.Mert, -1, 0, null); Q(380, 322, 1, 10, "#3a3a40"); Q(377, 314, 7, 9, "#3b6fd1"); Q(378, 315, 5, 7, "#f4f0e3"); }
  if (day === 1 && quest >= 10 && car.parked) person(1214, G - 16, PEOPLE.Kerem, -1, 0, null);
  if (!inBed) person(p.x - 1, p.y - 1, PEOPLE.her, p.face, p.walk, glasses);
}

buildWorld();


/* ============ HTML katmanları ============ */
function overlays() {
  const W = $("stage").clientWidth, Hh = $("stage").clientHeight, sx = W / VW, sy = Hh / VH;
  labels.forEach(l => { const x = (l.x - cam) * sx; l.el.style.left = x + "px"; l.el.style.top = l.y * sy + "px"; l.el.hidden = x < -60 || x > W + 60; });
  const it = !locked && !ended && !scene ? nearItem() : null, pr = $("prompt");
  if (it) {
    pr.hidden = false; pr.innerHTML = (touch ? "" : "<kbd>E</kbd> ") + it.label();
    pr.style.left = Math.min(W - 40, Math.max(40, (it.x - cam) * sx)) + "px"; pr.style.top = (it.fy - 20) * sy + "px";
  } else pr.hidden = true;
  const q = quests[quest], ar = $("arrow");
  if (q && !inBed && !ended && !scene) {
    let tx = q.x; const upstairs = p.y + p.h < 110;
    if (upstairs !== !!q.home) tx = 22;
    const d = tx - (p.x + 3);
    ar.hidden = false; ar.textContent = Math.abs(d) < 8 ? "Burada ●" : d > 0 ? "→" : "←";
  } else ar.hidden = true;
}

/* ============ Döngü ============ */
let acc = 0, prev = 0, running = false;
function loop(t) {
  const dt = Math.min(60, t - prev); prev = t; acc += dt;
  while (acc >= 1000 / 60) { if (running) step(); else frame++; acc -= 1000 / 60; }
  draw(); overlays();
  if (scene) scene.draw();
  requestAnimationFrame(loop);
}

/* ============ Girdi ============ */
const touch = matchMedia("(hover: none) and (pointer: coarse)").matches;
const map = {ArrowLeft: "l", a: "l", A: "l", ArrowRight: "r", d: "r", D: "r", ArrowUp: "j", w: "j", W: "j", " ": "j"};
addEventListener("keydown", e => {
  if (!running) return;
  if (e.key === "Escape" && scene && $("dialog").hidden) { scene.cancel(); return; }
  if (scene && $("dialog").hidden) { if (e.target.tagName !== "BUTTON") scene.key && scene.key(e.key); return; }
  if (e.key === "e" || e.key === "E" || (e.key === "Enter" && e.target.tagName !== "BUTTON")) { e.preventDefault(); interact(); return; }
  const k = map[e.key]; if (!k) return;
  if (e.key === " " && !$("dialog").hidden && !$("dialog").dataset.choice) { e.preventDefault(); nextLine(); return; }
  keys[k] = true; if (e.target.tagName !== "BUTTON") e.preventDefault();
});
addEventListener("keyup", e => { const k = map[e.key]; if (k) keys[k] = false; });
[["bL", "l"], ["bR", "r"], ["bJ", "j"]].forEach(([id, k]) => {
  const b = $(id);
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add("on"); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove("on"); };
  b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off); b.addEventListener("pointerleave", off); b.addEventListener("pointercancel", off);
});
$("bE").addEventListener("pointerdown", e => { e.preventDefault(); interact(); });

function begin() {
  if (scene) closeScene();
  dq = []; dDone = null; $("dialog").hidden = true;
  startDay(1); running = true; skyHour = 7.5; $("intro").hidden = true; $("outro").hidden = true; document.activeElement.blur();
  banner("Görev: Uyan");
}
$("introText").textContent = "Günaydın " + HER + "! Önünde iki dolu gün var: önce stüdyo, ders, kütüphane ve arkadaşlar; sonra da tenisli bir cumartesi. Ama önce yataktan kalkman lazım.";
$("outroTitle").textContent = CONFIG.outroTitle;
$("letter").textContent = CONFIG.letter + "\n\n— " + CONFIG.fromName;
$("start").addEventListener("click", begin);
$("again").addEventListener("click", begin);

function start(data) {
  const resume = data && data.running && !(data.quest <= 1);
  startDay(resume ? data.day || 1 : 1, resume ? data : {});
  if (resume) { running = true; skyHour = hourNow(); $("intro").hidden = true; }
  requestAnimationFrame(t => { prev = t; loop(t); });
}
start({});
