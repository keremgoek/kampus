<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Buket Kampüste</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buket Kampüste">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Layout: piksel tuval ortada; yakın plan sahneleri ve HTML katmanları tuvalin üstünde; telefonda altta düğmeler */
  :root {
    --bg: #181a24;
    --panel: #f5efe4;
    --panel-ink: #23222c;
    --accent: #f0b44c;
    --accent-deep: #a8701d;
    --line: #3b3f52;
    --phone-bg: #ffffff;
    --phone-ink: #1f1f24;
    --phone-mute: #8a8a94;
    --like: #e8435a;
    --f-display: "Pixelify Sans", "Courier New", monospace;
    --f-body: "Nunito", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--panel); font-family: var(--f-body);
    padding-inline: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
    padding-block: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom)); box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .stage {
    position: relative; width: min(100%, 1120px, calc((100dvh - 40px) * 16 / 9));
    aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 3px var(--line);
    background: var(--bg);
  }
  .world { position: absolute; inset: 0; transition: transform .55s cubic-bezier(.5,0,.3,1); }
  .world.zoom { transform: scale(3.2); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  body.notrun .hud { visibility: hidden; }
  .hud { position: absolute; z-index: 8; top: 2%; left: 1.5%; right: 1.5%; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  .hudleft { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 72%; }
  .qnav { display: flex; gap: 6px; pointer-events: auto; }
  .qnav button {
    font-family: var(--f-display); font-size: clamp(10px, 1.4vw, 14px); cursor: pointer; border: 0; border-radius: 4px; padding: .25em .6em;
    background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--panel-ink); box-shadow: 0 2px 0 var(--accent-deep);
  }
  .qnav button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--accent-deep); }
  .chip {
    font-family: var(--f-display); font-size: clamp(11px, 1.7vw, 18px); line-height: 1.2;
    background: var(--panel); color: var(--panel-ink); padding: .3em .6em; border-radius: 4px; box-shadow: 0 3px 0 var(--accent-deep);
  }
  .chip b { color: var(--accent-deep); }
  .quest { display: flex; gap: .5em; align-items: center; }
  .arrow { font-size: 1.2em; color: var(--accent-deep); }
  .label {
    position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
    font-family: var(--f-display); font-size: clamp(9px, 1.4vw, 15px); color: var(--panel);
    background: color-mix(in srgb, var(--panel-ink) 75%, transparent); padding: .1em .45em; border-radius: 3px;
  }
  .prompt {
    position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
    font-family: var(--f-display); font-size: clamp(10px, 1.6vw, 16px);
    background: var(--accent); color: var(--panel-ink); padding: .15em .5em; border-radius: 3px; box-shadow: 0 2px 0 var(--accent-deep);
  }
  .prompt kbd { font: inherit; font-weight: 700; }
  .dialog {
    position: absolute; left: 3%; right: 3%; bottom: 4%; z-index: 5;
    background: var(--panel); color: var(--panel-ink); border-radius: 6px; padding: .7em 1em;
    box-shadow: 0 0 0 3px var(--accent-deep), 0 6px 0 3px var(--line);
    display: flex; flex-direction: column; gap: .4em; cursor: pointer;
  }
  .dialog .who { font-family: var(--f-display); font-weight: 700; color: var(--accent-deep); font-size: clamp(12px, 1.8vw, 19px); }
  .dialog .text { font-size: clamp(13px, 2vw, 19px); line-height: 1.4; margin: 0; max-width: 70ch; }
  .dialog .more { align-self: flex-end; font-family: var(--f-display); font-size: clamp(10px, 1.4vw, 14px); opacity: .7; }
  .choices { display: flex; flex-wrap: wrap; gap: .5em; }
  .btn {
    font-family: var(--f-display); font-size: clamp(12px, 1.8vw, 18px); font-weight: 600;
    background: var(--accent); color: var(--panel-ink); border: 0; border-radius: 4px; padding: .45em 1em;
    box-shadow: 0 3px 0 var(--accent-deep); cursor: pointer;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-deep); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--panel-ink); }
  .btn:focus-visible, .pad button:focus-visible, .hot:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .fade {
    position: absolute; inset: 0; z-index: 6; background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-family: var(--f-display); font-size: clamp(16px, 3vw, 32px); color: var(--panel); text-align: center; padding: 1em;
    opacity: 0; pointer-events: none; transition: opacity .45s;
  }
  .fade.on { opacity: 1; }
  .banner {
    position: absolute; top: 14%; left: 50%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .3s, transform .3s; z-index: 4;
    font-family: var(--f-display); font-size: clamp(12px, 2vw, 20px); background: var(--panel-ink); color: var(--accent);
    padding: .35em .9em; border-radius: 4px; pointer-events: none; white-space: nowrap;
  }
  .banner.on { opacity: 1; transform: translate(-50%, 0); }

  /* Yakın plan */
  .close { position: absolute; inset: 0; z-index: 3; animation: closeIn .35s ease; background: var(--bg); }
  @keyframes closeIn { from { opacity: 0; } to { opacity: 1; } }
  /* Sahne düğmeleri 16:9 alanın içinde kalır; arka plan bütün ekrana yayılır */
  .cui { position: absolute; inset: 0; margin: auto; height: 100%; width: auto; max-width: 100%; aspect-ratio: 16 / 9; }
  .hot { position: absolute; background: transparent; border: 2px dashed transparent; border-radius: 6px; cursor: pointer; padding: 0; }
  .hot:hover { border-color: var(--accent); }
  .hot[aria-pressed="true"] { border: 3px solid var(--accent); }
  .hot span {
    position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 110%); white-space: nowrap;
    font-family: var(--f-display); font-size: clamp(10px, 1.5vw, 15px); background: var(--panel-ink); color: var(--panel); padding: .1em .45em; border-radius: 3px;
  }
  .hot[aria-pressed="true"] span { background: var(--accent); color: var(--panel-ink); }
  .cbar {
    position: absolute; left: 3%; right: 3%; bottom: 3%; display: flex; gap: .6em; align-items: center; justify-content: space-between; flex-wrap: wrap;
    background: var(--panel); color: var(--panel-ink); padding: .5em .8em; border-radius: 6px; box-shadow: 0 0 0 3px var(--accent-deep);
  }
  .cbar p { margin: 0; font-size: clamp(12px, 1.8vw, 17px); min-width: 0; flex: 1 1 14em; }
  .cbar div { display: flex; gap: .5em; }
  .drag { position: absolute; inset: 0; touch-action: none; }
  .phone {
    position: absolute; top: 3%; height: 94%; left: 50%; transform: translateX(-50%); aspect-ratio: 9 / 18;
    background: var(--panel-ink); border-radius: 18px; padding: 1.4%; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .screen {
    height: 100%; overflow-y: auto; background: var(--phone-bg); color: var(--phone-ink); border-radius: 13px;
    font-family: var(--f-body); font-size: clamp(9px, 1.35vw, 14px); scrollbar-width: none; overscroll-behavior: contain; touch-action: pan-y;
  }
  .screen::-webkit-scrollbar { display: none; }
  .apphead { position: sticky; top: 0; background: var(--phone-bg); padding: .7em .8em .5em; font-family: var(--f-display); font-weight: 700; font-size: 1.25em; border-bottom: 1px solid #ececf0; z-index: 1; }
  .post { border-bottom: 1px solid #ececf0; padding-bottom: .5em; }
  .post header { display: flex; align-items: center; gap: .45em; padding: .5em .7em; font-weight: 800; }
  .av { width: 1.8em; height: 1.8em; border-radius: 50%; flex: none; }
  .post canvas { width: 100%; height: auto; aspect-ratio: 4 / 3; display: block; cursor: pointer; }
  .acts { display: flex; align-items: center; gap: .4em; padding: .4em .7em 0; font-weight: 800; }
  .heart { background: none; border: 0; padding: 0; font-size: 1.5em; line-height: 1; color: var(--phone-ink); cursor: pointer; }
  .heart.on { color: var(--like); animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.4); } }
  .post p { margin: .2em .7em 0; line-height: 1.35; }
  .post p b { font-weight: 800; }
  .feedend { padding: 1.2em .8em 2em; text-align: center; color: var(--phone-mute); }
  /* WhatsApp bildirimi ve grup sohbeti */
  .notif {
    position: absolute; top: 4%; left: 6%; right: 6%; z-index: 2; text-align: left; cursor: pointer;
    background: rgba(246,246,248,.97); color: var(--phone-ink); border: 0; border-radius: 12px; padding: .55em .7em;
    font-family: var(--f-body); font-size: clamp(9px, 1.35vw, 14px); box-shadow: 0 6px 18px rgba(0,0,0,.3);
    animation: notifIn .45s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes notifIn { from { transform: translateY(-140%); } to { transform: none; } }
  .notif small { display: block; color: var(--phone-mute); font-size: .8em; }
  .notif b { display: block; }
  .chat {
    position: absolute; inset: 1.4%; z-index: 3; border-radius: 13px; overflow: hidden; display: flex; flex-direction: column;
    background: #ece5dc; color: var(--phone-ink); font-family: var(--f-body); font-size: clamp(9px, 1.35vw, 14px);
  }
  .chat header { display: flex; align-items: center; gap: .5em; padding: .6em .6em; background: #23614f; color: #fff; }
  .chat header button { background: none; border: 0; color: #fff; font-size: 1.6em; line-height: 1; padding: 0 .2em; cursor: pointer; }
  .chat header small { display: block; opacity: .8; font-size: .8em; }
  .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: .5em 0; scrollbar-width: none; }
  .msg { max-width: 78%; align-self: flex-start; background: #fff; padding: .35em .6em; border-radius: 9px; margin: .2em .6em; line-height: 1.3; animation: closeIn .3s; }
  .msg b { display: block; font-size: .8em; }
  .msg.me { align-self: flex-end; background: #d6f3c4; }
  .replies { display: flex; flex-direction: column; gap: .35em; padding: .5em; background: #f6f3ee; }
  .replies button { font: inherit; text-align: left; background: #fff; border: 1px solid #d8d2c8; border-radius: 16px; padding: .4em .7em; cursor: pointer; }
  /* Telefon görüşmesi */
  .screen.call {
    background: linear-gradient(#34405a, #151c29); color: #fff; display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; padding: 22% 0 16%; box-sizing: border-box; text-align: center;
  }
  .cav { width: 4.6em; height: 4.6em; border-radius: 50%; background: #e7b7c8; color: #6a2c40; display: grid; place-items: center; font-size: 1.5em; font-weight: 800; margin: 0 auto .5em; }
  .cname { font-weight: 800; font-size: 1.5em; display: block; }
  .cst { opacity: .75; }
  .accept { width: 3.8em; height: 3.8em; border-radius: 50%; border: 0; background: #34c759; color: #fff; font-size: 1.3em; cursor: pointer; animation: ring 1s infinite; }
  .accept.end { background: #e5484d; animation: none; }
  @keyframes ring { 50% { transform: scale(1.12); } }
  .side { position: absolute; right: 3%; bottom: 4%; display: flex; flex-direction: column; gap: .5em; align-items: flex-end; max-width: 28%; }
  .side p { margin: 0; font-family: var(--f-display); font-size: clamp(10px, 1.5vw, 15px); text-align: right; background: var(--panel-ink); color: var(--panel); padding: .3em .6em; border-radius: 4px; }

  .card {
    position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5%;
    padding: 5%; text-align: center; background: color-mix(in srgb, var(--bg) 88%, transparent);
  }
  .card h1 { font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: clamp(26px, 6vw, 64px); line-height: 1; margin: 0; text-wrap: balance; }
  .card p { margin: 0; max-width: 46ch; font-size: clamp(13px, 2vw, 19px); line-height: 1.5; text-wrap: pretty; }
  .card .letter { font-family: var(--f-display); font-size: clamp(12px, 1.9vw, 20px); line-height: 1.35; white-space: pre-line; max-width: 40ch; }
  #outro { justify-content: safe center; overflow-y: auto; gap: 2%; }
  #outro h1 { font-size: clamp(20px, 4.2vw, 46px); }
  #outro .btn { flex: none; }
  .card .keys { font-size: clamp(11px, 1.5vw, 14px); opacity: .75; }
  .pad { display: none; }
  .pad div { display: flex; gap: 12px; pointer-events: auto; }
  .pad button {
    min-width: 62px; height: 62px; padding: 0 14px; border-radius: 50%; touch-action: none;
    background: rgba(24, 26, 36, .38); color: rgba(255, 255, 255, .92); border: 2px solid rgba(255, 255, 255, .35);
    font-family: var(--f-display); font-size: 20px; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .pad #bE, .pad #bJ { border-radius: 31px; font-size: 16px; }
  .pad button.on { background: rgba(240, 180, 76, .65); color: var(--panel-ink); border-color: rgba(255, 255, 255, .6); }
  /* Telefonda: oyun bütün ekranı kaplar, kontroller oyunun üstünde yarı saydam durur */
  @media (hover: none) and (pointer: coarse) {
    body { padding: 0; gap: 0; }
    .stage { width: 100vw; height: 100dvh; aspect-ratio: auto; max-width: none; border-radius: 0; box-shadow: none; }
    .hud { top: max(2%, env(safe-area-inset-top)); left: max(1.5%, env(safe-area-inset-left)); right: max(1.5%, env(safe-area-inset-right)); }
    .pad {
      display: flex; position: fixed; z-index: 4; pointer-events: none; justify-content: space-between; align-items: flex-end;
      left: max(18px, env(safe-area-inset-left)); right: max(18px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
      transition: opacity .2s;
    }
    body.busy .pad { opacity: 0; }
    body.busy .pad div { pointer-events: none; }
    .card .keys { display: none; }
  }
  /* Telefon dik tutulursa oyun çok küçük kalıyor: yan çevirmesini iste */
  .rotate { display: none; }
  @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
    .rotate {
      display: flex; position: fixed; inset: 0; z-index: 50; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: var(--bg); color: var(--panel); font-family: var(--f-display); font-size: 22px; text-align: center; padding: 24px;
    }
    .rotate span { font-size: 56px; animation: tilt 1.6s ease-in-out infinite; }
  }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { .fade, .banner, .world { transition: none; } .close, .heart.on, .notif, .msg, .accept, .rotate span { animation: none; } }
</style>

</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world">
    <canvas id="cv" width="640" height="360" aria-label="Oyun alanı"></canvas>
    <div id="labels"></div>
    <div class="prompt" id="prompt" hidden></div>
  </div>
  <div class="close" id="close" hidden>
    <canvas id="ccv" width="640" height="360" aria-hidden="true"></canvas>
    <div class="cui" id="cui"></div>
  </div>
  <div class="hud">
    <div class="hudleft">
      <div class="chip quest"><span id="clock">07:30</span><span id="qtext"></span></div>
      <div class="qnav"><button id="qprev" type="button" aria-label="Önceki görev">◀ Önceki</button><button id="qnext" type="button" aria-label="Görevi atla">Atla ▶</button></div>
    </div>
    <div class="chip arrow" id="arrow" hidden>→</div>
  </div>
  <div class="banner" id="banner"></div>
  <div class="dialog" id="dialog" hidden>
    <div class="who" id="dwho"></div>
    <p class="text" id="dtext"></p>
    <div class="choices" id="dchoices"></div>
    <div class="more" id="dmore">E / dokun ▸</div>
  </div>
  <div class="fade" id="fade"></div>
  <div class="card" id="intro">
    <h1>Buket Kampüste</h1>
    <button class="btn" id="start" type="button">Güne başla</button>
  </div>
  <div class="card" id="outro" hidden>
    <h1 id="outroTitle"></h1>
    <p class="letter" id="letter"></p>
    <button class="btn" id="again" type="button">Baştan oyna</button>
  </div>
</div>
<div class="pad">
  <div><button id="bL" type="button" aria-label="Sola">◀</button><button id="bR" type="button" aria-label="Sağa">▶</button></div>
  <div><button id="bE" type="button">Kullan</button><button id="bJ" type="button">Zıpla</button></div>
</div>
<div class="rotate" aria-live="polite"><span aria-hidden="true">📱</span>Telefonu yan çevir</div>

<script>
/* ============ Kişiselleştirme ============ */
const CONFIG = {
  herName: "Buket",
  fromName: "Kerem",
  outroTitle: "İyi ki varsın",
  letter: "İki gün boyunca koşturdun: stüdyo, ders, kütüphane, tenis, alışveriş, piknik, Oxford...\nGünün sonunda seni görmek benim en sevdiğim an.\nSeni seviyorum.",
};
const HER = CONFIG.herName;

/* ============ Dünya ============ */
let VW = 320; const VH = 180, WORLD = 1260, G = 170, F2 = 102;
const SHOE = "#2a2420";
const cv = $("cv"), ctx = cv.getContext("2d");
// Yakın plan sahneleri 640x360'lık bir ara tuvale çizilir, sonra ekrandaki tuvale ortalanıp kenarlara uzatılır.
const SCN = document.createElement("canvas"); SCN.width = 640; SCN.height = 360;
const cctx = SCN.getContext("2d"), ccv = $("ccv"), dctx = ccv.getContext("2d");
function presentScene() {
  const W = VW * 2;
  if (ccv.width !== W) ccv.width = W;
  const ox = Math.floor((W - 640) / 2);
  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(SCN, ox, 0);
  const rw = W - ox - 640;
  if (ox > 0) { dctx.save(); dctx.translate(ox, 0); dctx.scale(-1, 1); dctx.drawImage(SCN, 0, 0, ox, 360, 0, 0, ox, 360); dctx.restore(); }
  if (rw > 0) { dctx.save(); dctx.translate(ox + 640 + rw, 0); dctx.scale(-1, 1); dctx.drawImage(SCN, 640 - rw, 0, rw, 360, 0, 0, rw, 360); dctx.restore(); }
}
function $(id) { return document.getElementById(id); }
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const solids = [
  {x: -20, y: G, w: WORLD + 40, h: 20},
  {x: 0, y: 136, w: 172, h: 2},
  {x: 0, y: F2, w: 192, h: 2},
  {x: 0, y: 68, w: 172, h: 2},
  {x: 0, y: 34, w: 174, h: 3},
  {x: 0, y: 70, w: 2, h: 32},
  {x: 190, y: 92, w: 2, h: 10},
  {x: -4, y: 0, w: 4, h: VH}, {x: WORLD, y: 0, w: 4, h: VH},
];
const tiers = [[450,464,4],[464,478,8],[478,492,12],[492,506,16],[506,520,20],[520,534,24],[534,540,20],[540,546,16],[546,552,12],[552,558,8],[558,564,4]];
tiers.forEach(([a, b, h]) => solids.push({x: a, y: G - h, w: b - a, h}));

const PEOPLE = {
  her:   {hair: "#8a5a3b", long: true,  shirt: "#d98f6a", pants: "#4a6283", skin: "#f8e0d0"},
  Asya:  {hair: "#1b1b1b", long: true,  shirt: "#8a5cc2", pants: "#3a3550"},
  Nilsu: {hair: "#b9793a", long: true,  shirt: "#e7b7c8", pants: "#4a4a5a"},
  Mert:  {hair: "#4a3020", long: false, shirt: "#3c6fb0", pants: "#2d2d38"},
  Emir:  {hair: "#1b1b1b", long: false, shirt: "#d0703a", pants: "#3a3a3a"},
  Kerem: {hair: "#2a1f18", long: false, shirt: "#c43c4c", pants: "#26303f"},
  Ali:   {hair: "#141414", long: false, wavy: true, shirt: "#5d6f84", pants: "#2d2d38"},
  Cagla: {hair: "#141414", long: true,  shirt: "#c43c6c", pants: "#2a2a36"},
  Emre:  {hair: "#6b4426", long: true,  shirt: "#4f7a4a", pants: "#3a3a48"},

  $("dialog").hidden = false;
